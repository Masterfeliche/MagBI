# Every push and pull request: lint, types and unit tests for the server and the
# web app, the SQL Server connector against a real SQL Server, then the
# end-to-end suite (server/scripts/e2e.py) against a fresh dev server and web
# app in headless Chrome. The E2E results and screenshots are kept as a build
# artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # pyodbc (the SQL Server connector) needs the system ODBC library to import.
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy magbi
      - run: pytest -q

  server-integration:
    name: Server against a real SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MagBI_Test_Passw0rd!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 15s
    env:
      MAGBI_TEST_MSSQL_HOST: localhost
      MAGBI_TEST_MSSQL_PORT: "1433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - run: pip install -e ".[dev]"
        working-directory: server
      - run: pytest -m integration
        working-directory: server

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Includes the theme checks: every built-in theme must stay readable and colour-blind safe.
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end
    needs: [server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Install
        run: |
          pip install -e "server[dev]"
          npm ci --prefix web
      - name: Start the dev server and the web app
        run: |
          (cd server && nohup python dev_server.py > ../dev-server.log 2>&1 &)
          (cd web && nohup npm run dev -- --strictPort > ../web.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null && curl -sf http://localhost:3000/ > /dev/null; then
              echo "both up after ${i} s"; exit 0
            fi
            sleep 1
          done
          echo "servers did not start"; tail -50 dev-server.log web.log; exit 1
      - name: Run the end-to-end suite
        working-directory: server
        run: python scripts/e2e.py --out ../e2e-results
      - name: Keep the results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results/
            dev-server.log
            web.log
          retention-days: 14
