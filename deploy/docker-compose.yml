# Usage:  cd deploy && docker compose up --build
# Secrets: copy .env.example to .env. With MAGBI_ENVIRONMENT=prod the api refuses
# to start without MAGBI_CREDENTIAL_KEY and a non-default MAGBI_JWT_SECRET.

services:
  api:
    build: ../server
    ports:
      - "8000:8000"
    environment:
      MAGBI_ENVIRONMENT: ${MAGBI_ENVIRONMENT:-dev}
      MAGBI_DATABASE_URL: postgresql+asyncpg://magbi:magbi@postgres:5432/magbi
      MAGBI_REDIS_URL: redis://redis:6379/0
      MAGBI_DUCKDB_DATA_DIR: /data/datasets
      MAGBI_CREDENTIAL_KEY: ${MAGBI_CREDENTIAL_KEY:-}
      MAGBI_JWT_SECRET: ${MAGBI_JWT_SECRET:-change-me-in-production}
      MAGBI_CONNECTOR_ALLOWED_HOSTS: ${MAGBI_CONNECTOR_ALLOWED_HOSTS:-}
      MAGBI_INSECURE_ADMIN_API: ${MAGBI_INSECURE_ADMIN_API:-false}
    volumes:
      - duckdb-data:/data/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Enabled with `--profile worker` once the Celery app exists (Sprint 8).
  worker:
    profiles: ["worker"]
    build: ../server
    command: celery -A magbi.refresh.orchestrator worker --loglevel=info
    environment:
      MAGBI_ENVIRONMENT: ${MAGBI_ENVIRONMENT:-dev}
      MAGBI_DATABASE_URL: postgresql+asyncpg://magbi:magbi@postgres:5432/magbi
      MAGBI_REDIS_URL: redis://redis:6379/0
      MAGBI_DUCKDB_DATA_DIR: /data/datasets
      MAGBI_CREDENTIAL_KEY: ${MAGBI_CREDENTIAL_KEY:-}
      MAGBI_JWT_SECRET: ${MAGBI_JWT_SECRET:-change-me-in-production}
      MAGBI_CONNECTOR_ALLOWED_HOSTS: ${MAGBI_CONNECTOR_ALLOWED_HOSTS:-}
      MAGBI_INSECURE_ADMIN_API: ${MAGBI_INSECURE_ADMIN_API:-false}
    volumes:
      - duckdb-data:/data/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Enabled with `--profile web` once the web app has an entry point (Sprint 9).
  web:
    profiles: ["web"]
    build: ../web
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magbi
      POSTGRES_PASSWORD: magbi
      POSTGRES_DB: magbi
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magbi -d magbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQL Server used only by the connector integration tests:
  #   docker compose --profile test up -d --wait mssql-test
  # Then: cd ../server && pytest -m integration
  # (override host/port/password with MAGBI_TEST_MSSQL_* environment variables)
  mssql-test:
    profiles: ["test"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MagBI_Test_Passw0rd!"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg-data:
  duckdb-data:
