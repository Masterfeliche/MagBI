[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magbi"
version = "0.1.0"
description = "MagBI — general-purpose BI engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "sqlglot>=25.0",
    "redis>=5.0",
    "celery>=5.4",
    "cryptography>=43.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pyodbc>=5.1",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["magbi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# pyarrow and pyodbc ship no type information
module = ["pyarrow", "pyarrow.*", "pyodbc"]
ignore_missing_imports = true
